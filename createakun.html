<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KILLUA — DAFTAR AKUN</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-box">
  <div class="logo">📝</div>
  <div class="title">DAFTAR AKUN</div>
  <div class="subtitle">KILLUA PANEL</div>

  <div class="form-group">
    <label>USERNAME</label>
    <input type="text" id="username" placeholder="Min. 3 karakter" autocomplete="off">
  </div>

  <div class="form-group">
    <label>PASSWORD</label>
    <input type="password" id="password" placeholder="Min. 6 karakter" autocomplete="off">
  </div>

  <div class="form-group">
    <label>KONFIRMASI PASSWORD</label>
    <input type="password" id="password2" placeholder="Ulangi password" autocomplete="off">
  </div>

  <button class="btn-login" id="btnReg" onclick="doRegister()">DAFTAR</button>

  <div class="msg" id="msg"></div>

  <a class="register-link" href="index.html">← Sudah punya akun? Login</a>

  <div class="footer">
    © DEVELOPED BY <b>LEXZY DEV</b>
  </div>
</div>

<script>
  const BUILTIN_USERS = ['Lexzy Dev', 'Lexzy', 'Killua'];
  const STORAGE_USERS = 'killua_registered_users';

  function getRegisteredUsers() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_USERS) || '[]');
    } catch (e) {
      return [];
    }
  }

  function saveRegisteredUsers(arr) {
    localStorage.setItem(STORAGE_USERS, JSON.stringify(arr));
  }

  function doRegister() {
    const u   = document.getElementById('username').value.trim();
    const p   = document.getElementById('password').value;
    const p2  = document.getElementById('password2').value;
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btnReg');

    // Validasi
    if (!u || !p || !p2) {
      msg.className = 'msg err';
      msg.textContent = 'Semua kolom wajib diisi!';
      return;
    }
    if (u.length < 3) {
      msg.className = 'msg err';
      msg.textContent = 'Username minimal 3 karakter!';
      return;
    }
    if (p.length < 6) {
      msg.className = 'msg err';
      msg.textContent = 'Password minimal 6 karakter!';
      return;
    }
    if (p !== p2) {
      msg.className = 'msg err';
      msg.textContent = 'Password dan konfirmasi tidak sama!';
      return;
    }

    // Cek duplikat
    if (BUILTIN_USERS.find(x => x.toLowerCase() === u.toLowerCase())) {
      msg.className = 'msg err';
      msg.textContent = 'Username sudah dipakai!';
      return;
    }
    const users = getRegisteredUsers();
    if (users.find(x => x.username.toLowerCase() === u.toLowerCase())) {
      msg.className = 'msg err';
      msg.textContent = 'Username sudah dipakai!';
      return;
    }

    // Simpan
    btn.disabled = true;
    btn.classList.add('loading');
    btn.textContent = 'MENDAFTAR';

    setTimeout(() => {
      users.push({
        username: u,
        password: p,
        role: 'user',
        registeredAt: Date.now()
      });
      saveRegisteredUsers(users);

      msg.className = 'msg ok';
      msg.textContent = '✓ Pendaftaran berhasil! Mengalihkan ke login...';
      btn.textContent = 'BERHASIL';

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1800);
    }, 600);
  }

  document.getElementById('password2').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doRegister();
  });
</script>

</body>
</html>
